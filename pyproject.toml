[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anima-harness"
version = "0.1.0"
description = "ANIMA — the agent is the artifact, the harness is its nervous system."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cherubesque" }]
keywords = ["agent", "harness", "memory", "continuity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# Pure stdlib at runtime — no dependencies, deliberately.
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
anima = "anima.cli:main"

[tool.setuptools.packages.find]
include = ["anima*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
